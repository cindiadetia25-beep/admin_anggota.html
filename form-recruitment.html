<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran PASKIBRA MAN 6 Ciamis</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/american-captain" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'American Captain', 'Segoe UI', sans-serif; letter-spacing: 1px; }
        body { background: linear-gradient(135deg, #4a000b 0%, #2b0006 50%, #800000 100%); min-height: 100vh; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(50, 0, 10, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 16px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .header-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .custom-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            transition: trans 0.3s;
        }

        .custom-logo:hover { transform: scale(1.08); }

        h2 { color: #ffd700; text-align: center; margin-bottom: 20px; font-size: 2rem; border-bottom: 2px solid rgba(255, 215, 0, 0.3); padding-bottom: 10px; line-height: 1.1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ffcc66; font-size: 1rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 215, 0, 0.3); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(45deg, #ffd700, #ffaa00); color: #4a000b; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        /* MODAL NOTIFIKASI FORM */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #32000a;
            border: 2px solid #ffd700;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            text-align: center;
        }

        .modal-content h3 { color: #ffd700; margin-bottom: 12px; font-size: 1.7rem; }
        .modal-content p { color: #ffcc66; font-size: 1.05rem; margin-bottom: 20px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-logo-box">
        <img class="custom-logo" src="assets/logo-paskibra.png" alt="Logo Paskibra MAN 6 Ciamis">
     <form id="publicOrForm" onsubmit="submitPublicOR(event)">
    <div class="form-group">
        <label>NAMA LENGKAP</label>
        <input type="text" id="nama" placeholder="NAMA LENGKAP ANDA" required>
    </div>

    <div class="form-group">
        <label>TEMPAT, TANGGAL LAHIR</label>
        <input type="text" id="ttl" placeholder="CONTOH: CIAMIS, 12 MEI 2008" required>
    </div>

    <div class="form-group">
        <label>NO. WHATSAPP / HP</label>
        <input type="tel" id="no_hp" placeholder="08XXXXXXXXXX" required>
    </div>

    <div class="form-group">
        <label>ALUMNI SMP / MTS</label>
        <input type="text" id="alumni_smp" placeholder="CONTOH: MTS N 1 CIAMIS" required>
    </div>

    <div class="form-group">
        <label>KELAS SAAT INI</label>
        <input type="text" id="kelas" placeholder="CONTOH: X.1" required>
    </div>

    <!-- ISIAN BARU: TINGGI BADAN & BERAT BADAN -->
    <div class="form-group">
        <label>TINGGI BADAN (CM)</label>
        <input type="number" id="tinggi_badan" placeholder="CONTOH: 165" required>
    </div>

    <div class="form-group">
        <label>BERAT BADAN (KG)</label>
        <input type="number" id="berat_badan" placeholder="CONTOH: 55" required>
    </div>

    <div class="form-group">
        <label>ALASAN BERGABUNG</label>
        <textarea id="alasan_bergabung" placeholder="TULISKAN MOTIVASI ANDA..." rows="3" required></textarea>
    </div>

    <button type="submit" class="btn-submit">
        <i class="fas fa-paper-plane"></i> KIRIM PENDAFTARAN
    </button>
</form>
</div>

<!-- MODAL NOTIFIKASI CENTERED -->
<div id="formNotifModal" class="modal">
    <div class="modal-content">
        <h3 id="notifTitle"><i class="fas fa-check-circle"></i> BERHASIL</h3>
        <p id="notifMessage">Pendaftaran berhasil dikirim!</p>
        <button class="btn-submit" onclick="closeNotifModal()" style="font-size:1rem; padding:8px 16px;">TUTUP</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzQmY4XGvBLnoeHRo6W4gMFXQAbNESiv8ZLN0fkGIgtMxLA_riQmBRFp-hyCLXDG6D/exec";

    function showFormNotif(title, message, isSuccess = true) {
        document.getElementById("notifTitle").innerHTML = `<i class="fas ${isSuccess ? 'fa-check-circle' : 'fa-times-circle'}" style="color:${isSuccess ? '#2ecc71' : '#e74c3c'}"></i> ${title}`;
        document.getElementById("notifMessage").innerText = message;
        document.getElementById("formNotifModal").style.display = "flex";
    }

    function closeNotifModal() {
        document.getElementById("formNotifModal").style.display = "none";
    }

  async function submitPublicOR(e) {
    e.preventDefault();

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENGIRIM...';

    const payload = {
        action: "submitOR",
        nama_pendaftar: document.getElementById("nama").value.trim(),
        ttl: document.getElementById("ttl").value.trim(),
        no_hp: document.getElementById("no_hp").value.trim(),
        alumni_smp: document.getElementById("alumni_smp").value.trim(),
        kelas: document.getElementById("kelas").value.trim(),
        tinggi_badan: document.getElementById("tinggi_badan").value.trim(),
        berat_badan: document.getElementById("berat_badan").value.trim(),
        alasan_bergabung: document.getElementById("alasan_bergabung").value.trim()
    };

    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        alert("PENDAFTARAN BERHASIL! Data Anda telah terkirim ke panitia Paskibra.");
        e.target.reset();
    } catch (error) {
        console.error("Error submit OR:", error);
        alert("Gagal mengirim pendaftaran. Periksa koneksi internet Anda.");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> KIRIM PENDAFTARAN';
    }
}
</script>

</body>
</html>
