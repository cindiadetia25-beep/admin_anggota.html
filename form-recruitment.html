<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran PASKIBRA MAN 6 Ciamis</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/american-captain" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'American Captain', 'Segoe UI', sans-serif; letter-spacing: 1px; }
        body { background: linear-gradient(135deg, #4a000b 0%, #2b0006 50%, #800000 100%); min-height: 100vh; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(50, 0, 10, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 16px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .header-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .custom-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .custom-logo:hover { transform: scale(1.08); }

        h2 { color: #ffd700; text-align: center; margin-bottom: 20px; font-size: 2rem; border-bottom: 2px solid rgba(255, 215, 0, 0.3); padding-bottom: 10px; line-height: 1.1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ffcc66; font-size: 1rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 215, 0, 0.3); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(45deg, #ffd700, #ffaa00); color: #4a000b; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="card">
    <div class="header-logo-box">
        <img class="custom-logo" src="assets/logo-paskibra.png" alt="Logo Paskibra MAN 6 Ciamis">
        <h2>FORMULIR OPEN RECRUITMENT PASKIBRA</h2>
    </div>
    
    <form onsubmit="submitPendaftaran(event)">
        <div class="form-group">
            <label>NAMA LENGKAP</label>
            <input type="text" id="nama" placeholder="Nama Lengkap Anda" required>
        </div>
        <div class="form-group">
            <label>TEMPAT, TANGGAL LAHIR</label>
            <input type="text" id="ttl" placeholder="Contoh: Ciamis, 12 Mei 2008" required>
        </div>
        <div class="form-group">
            <label>NO. WHATSAPP / HP</label>
            <input type="tel" id="noHp" placeholder="08xxxxxxxxxx" required>
        </div>
        <div class="form-group">
            <label>ALUMNI SMP / MTS</label>
            <input type="text" id="alumniSmp" placeholder="Contoh: MTs N 1 Ciamis" required>
        </div>
        <div class="form-group">
            <label>KELAS SAAT INI</label>
            <input type="text" id="kelas" placeholder="Contoh: X.1" required>
        </div>
        <div class="form-group">
            <label>ALASAN BERGABUNG</label>
            <textarea id="alasan" rows="3" placeholder="Tuliskan motivasi Anda..." required></textarea>
        </div>
        <button type="submit" id="btnSubmit" class="btn-submit"><i class="fas fa-paper-plane"></i> KIRIM PENDAFTARAN</button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzQmY4XGvBLnoeHRo6W4gMFXQAbNESiv8ZLN0fkGIgtMxLA_riQmBRFp-hyCLXDG6D/exec";

    async function submitPendaftaran(e) {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Mengirim...";

        const payload = {
            action: "submitOR",
            nama_pendaftar: document.getElementById("nama").value,
            ttl: document.getElementById("ttl").value,
            no_hp: document.getElementById("noHp").value,
            alumni_smp: document.getElementById("alumniSmp").value,
            kelas: document.getElementById("kelas").value,
            alasan_bergabung: document.getElementById("alasan").value
        };

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            alert("Pendaftaran berhasil dikirim! Silakan tunggu konfirmasi dari pengurus Paskibra.");
            e.target.reset();
        } catch (err) {
            alert("Gagal mengirim pendaftaran. Periksa koneksi internet Anda.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = "<i class='fas fa-paper-plane'></i> KIRIM PENDAFTARAN";
        }
    }
</script>

</body>
</html>
