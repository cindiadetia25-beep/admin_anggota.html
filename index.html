<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Manajemen Anggota & Absensi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #00f2fe; margin-bottom: 5px; }
        header p { color: #a1c4fd; font-size: 0.95rem; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #00f2fe; color: #0f2027; border-color: #00f2fe; }

        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        th { background: rgba(0, 242, 254, 0.2); color: #00f2fe; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a1c4fd; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; }
        .form-group option { background: #203a43; color: #fff; }
        .btn { padding: 10px 20px; background: linear-gradient(45deg, #00c6ff, #0072ff); border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-users-cog"></i> Dashboard Admin Organisasi</h1>
        <p>Kelola Anggota, Absensi Mingguan, dan Open Recruitment</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-anggota')"><i class="fas fa-address-book"></i> Daftar Anggota</button>
        <button class="tab-btn" onclick="switchTab('tab-absensi')"><i class="fas fa-calendar-check"></i> Absensi Mingguan</button>
        <button class="tab-btn" onclick="switchTab('tab-recruitment')"><i class="fas fa-user-plus"></i> Open Recruitment</button>
    </div>

    <!-- TAB 1: DAFTAR ANGGOTA -->
    <div id="tab-anggota" class="card tab-content active">
        <h2>Daftar Anggota Aktif</h2>
        <table>
            <thead>
                <tr>
                    <th>NIS</th>
                    <th>Nama Lengkap</th>
                    <th>Kelas</th>
                    <th>Jabatan</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableAnggota">
                <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- TAB 2: ABSENSI KEHADIRAN -->
    <div id="tab-absensi" class="card tab-content">
        <h2>Input Absensi Pertemuan</h2>
        <form id="formAbsensi" onsubmit="submitAbsensi(event)">
            <div class="form-group">
                <label>Pilih Anggota (NIS - Nama)</label>
                <select id="absensiNama" required></select>
            </div>
            <div class="form-group">
                <label>Pertemuan / Hari (3x Seminggu)</label>
                <select id="absensiPertemuan" required>
                    <option value="Pertemuan 1 (Senin)">Pertemuan 1 (Senin)</option>
                    <option value="Pertemuan 2 (Rabu)">Pertemuan 2 (Rabu)</option>
                    <option value="Pertemuan 3 (Jumat)">Pertemuan 3 (Jumat)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Keterangan Kehadiran</label>
                <select id="absensiStatus" required>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alpha">Alpha</option>
                </select>
            </div>
            <button type="submit" class="btn"><i class="fas fa-save"></i> Simpan Absensi</button>
        </form>
    </div>

    <!-- TAB 3: OPEN RECRUITMENT -->
    <div id="tab-recruitment" class="card tab-content">
        <h2>Pendaftar Anggota Baru (OR)</h2>
        <table>
            <thead>
                <tr><th>Tanggal</th><th>Nama Pendaftar</th><th>Kelas</th><th>Alasan</th><th>Status</th></tr>
            </thead>
            <tbody id="tableOR">
                <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzQmY4XGvBLnoeHRo6W4gMFXQAbNESiv8ZLN0fkGIgtMxLA_riQmBRFp-hyCLXDG6D/exec";

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();

            const tbodyAnggota = document.getElementById("tableAnggota");
            const selectAbsensi = document.getElementById("absensiNama");
            tbodyAnggota.innerHTML = "";
            selectAbsensi.innerHTML = "";

            if (data.anggota) {
                data.anggota.forEach(a => {
                    const nisVal = a.NIS || "-";
                    tbodyAnggota.innerHTML += `
                        <tr>
                            <td><strong>${nisVal}</strong></td>
                            <td>${a.Nama_Lengkap}</td>
                            <td>${a.Kelas}</td>
                            <td>${a.Jabatan}</td>
                            <td>${a.Status}</td>
                        </tr>`;
                    
                    selectAbsensi.innerHTML += `<option value="${a.Nama_Lengkap}" data-nis="${nisVal}">[${nisVal}] ${a.Nama_Lengkap} - ${a.Kelas}</option>`;
                });
            }

            const tbodyOR = document.getElementById("tableOR");
            tbodyOR.innerHTML = "";
            if (data.recruitment) {
                data.recruitment.forEach(r => {
                    tbodyOR.innerHTML += `
                        <tr>
                            <td>${new Date(r.Timestamp).toLocaleDateString('id-ID')}</td>
                            <td>${r.Nama_Pendaftar}</td>
                            <td>${r.Kelas}</td>
                            <td>${r.Alasan_Bergabung}</td>
                            <td>${r.Status_Seleksi}</td>
                        </tr>`;
                });
            }
        } catch (err) {
            console.error("Gagal memuat data:", err);
        }
    }

    async function submitAbsensi(e) {
        e.preventDefault();
        const selectElem = document.getElementById("absensiNama");
        const nama = selectElem.value;
        const nis = selectElem.options[selectElem.selectedIndex].getAttribute("data-nis");
        const pertemuan = document.getElementById("absensiPertemuan").value;
        const keterangan = document.getElementById("absensiStatus").value;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addAbsensi", nis: nis, nama: nama, pertemuan: pertemuan, keterangan: keterangan })
            });
            alert(`Absensi untuk ${nama} (${nis}) berhasil disimpan!`);
            loadData();
        } catch (err) {
            alert("Gagal menyimpan absensi.");
        }
    }

    loadData();
</script>

</body>
</html>
